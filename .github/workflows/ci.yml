name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.12 is the oldest supported here; 3.14 is what the owner develops on.
        # Testing only one of them means CI can be green while the machine that
        # matters is broken, or the reverse.
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt

      # tests/test_binding.py compiles core/ and calls it through ctypes, so a
      # missing compiler must fail HERE, as its own named step, rather than as
      # a FileNotFoundError buried in a pytest traceback. Both runner images
      # ship gcc; this step exists to say so out loud if that ever changes.
      - name: C toolchain is present
        run: gcc --version

      - run: python -m pytest tests/ -v
      - name: constant table is not stale
        run: |
          python -m sim.emit_constants_table
          git diff --exit-code docs/constants.md
